name: Release Design System Container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-design-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish design system image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out design system
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate design system
        run: pnpm run check && pnpm run test:unit

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify design system interface
        run: pnpm run test:e2e

      - name: Build design system
        run: pnpm build

      - name: Normalize image namespace
        id: image-names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish design system image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.owner }}/design-system:${{ github.sha }}
            ghcr.io/${{ steps.image-names.outputs.owner }}/design-system:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
