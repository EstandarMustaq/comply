server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:comply_db}}
    username: ${DB_USER:${POSTGRES_USER:comply_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

comply:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      refresh-expiration-days: 7
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY:${MFA_AES_KEY}}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://trycomply.io}

logging:
  level:
    root: WARN
    com.comply: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
