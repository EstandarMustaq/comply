server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: comply-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:comply_db}}
    username: ${DB_USER:${POSTGRES_USER:comply_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:comply_dev_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}
      timeout: 2000ms
  http:
    converters:
      preferred-json-mapper: jackson2

springdoc:
  api-docs:
    enabled: ${COMPLY_API_DOCS_ENABLED:false}

comply:
  bootstrap:
    enabled: ${COMPLY_BOOTSTRAP_ENABLED:false}
    admin:
      full-name: ${COMPLY_BOOTSTRAP_ADMIN_FULL_NAME:}
      email: ${COMPLY_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${COMPLY_BOOTSTRAP_ADMIN_PASSWORD:}
    ocos:
      full-name: ${COMPLY_BOOTSTRAP_OCOS_FULL_NAME:}
      email: ${COMPLY_BOOTSTRAP_OCOS_EMAIL:}
      password: ${COMPLY_BOOTSTRAP_OCOS_PASSWORD:}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      refresh-expiration-days: 7
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY:${MFA_AES_KEY:0123456789abcdef0123456789abcdef}}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  compliance:
    simplified-regime:
      monthly-limit: 30000.00
      annual-limit: 240000.00
    sanctions:
      sla-hours: 24
    pep:
      max-review-interval-days: 365
    retention:
      standard-years: 10
  imports:
    storage-path: ${COMPLY_IMPORT_STORAGE_PATH:${java.io.tmpdir}/comply-imports}
    pending-ttl-hours: ${COMPLY_IMPORT_PENDING_TTL_HOURS:24}

logging:
  level:
    com.comply: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
