name: "[CI:GATE] Quality Assurance"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: "[TEST:API] Spring Boot Service & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7
      - name: "[SETUP] Java 21 Toolchain"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: "[SETUP] Gradle Cache"
        uses: gradle/actions/setup-gradle@v6
      - name: "[TEST] Test and package API"
        run: ./gradlew --no-daemon :api:spotlessCheck :api:test :api:bootJar

  web:
    name: "[TEST:UI] Workspace Validation & Storybook"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7
      - name: "[SETUP] Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: "[SETUP] Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: "[SETUP] Install workspace dependencies"
        run: pnpm install --frozen-lockfile
      - name: "[CHECK] Check types, lint, and formatting"
        run: pnpm check
      - name: "[TEST] Run UI unit tests"
        run: pnpm test:unit
      - name: "[TEST] Verify component library with Storybook"
        run: pnpm storybook:build
      - name: "[BUILD] Build Next.js application and workspace packages"
        run: pnpm exec turbo run build

  api-contract:
    name: "[TEST:CONTRACT] OpenAPI Schema & Contract Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: comply_contract
          POSTGRES_USER: comply_app
          POSTGRES_PASSWORD: comply_contract_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comply_app -d comply_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7
      - name: "[SETUP] Java 21 Toolchain"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: "[SETUP] Gradle Cache"
        uses: gradle/actions/setup-gradle@v6
      - name: "[SETUP] Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: "[SETUP] Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: "[SETUP] Install workspace dependencies"
        run: pnpm install --frozen-lockfile
      - name: "[START] Launch Spring API in contract mode"
        env:
          SPRING_PROFILES_ACTIVE: contract
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: comply_contract
          DB_USER: comply_app
          DB_PASSWORD: comply_contract_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          COMPLY_API_DOCS_ENABLED: "true"
        run: ./gradlew --no-daemon :api:bootRun > /tmp/comply-api.log 2>&1 &
      - name: "[CHECK] Wait for API readiness"
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/comply-api.log
          exit 1
      - name: "[BUILD] Generate client types from Springdoc"
        env:
          COMPLY_OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
        run: pnpm api:openapi
      - name: "[CHECK] Verify the checked-in documentation contract"
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/openapi.json)" ]; then
            echo "Regenerate and commit docs/openapi.json with pnpm api:openapi."
            git status --short -- docs/openapi.json
            exit 1
          fi
      - name: "[CHECK] Type-check generated API client"
        run: pnpm --filter @comply/api-clients run typecheck
      - name: "[TEST] Run API and UI contract assertions"
        env:
          COMPLY_OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
        run: pnpm test:contract

  configuration:
    name: "[CHECK:CONFIG] Repository Topology & Security Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7
      - name: "[SETUP] Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - name: "[SETUP] Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: "[SETUP] Install workspace dependencies"
        run: pnpm install --frozen-lockfile
      - name: "[TEST] Exercise Git hook behavior"
        run: pnpm hooks:test
      - name: "[TEST] Test operational safety checks"
        run: pnpm operations:test
      - name: "[CHECK] Validate unified Compose profiles"
        run: pnpm compose:config
      - name: "[CHECK] Validate scripts and worktree topology"
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done
          test ! -e scripts/backup-s3.sh
          test ! -e scripts/deploy-production.sh
          test -f .agents/skills/product-quality/SKILL.md
          for file in .githooks/*; do sh -n "$file"; test -x "$file"; done
          node -e "JSON.parse(require('node:fs').readFileSync('.zed/tasks.json', 'utf8'))"
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .github/copilot-instructions.md
          test -f .github/instructions/api.instructions.md
          test -f .github/instructions/ui.instructions.md
          test -f pnpm-workspace.yaml
          test -f turbo.json
          test -f gradlew
          test -f apps/ui/.env.example
          test -f docs/standards/product-language.md
          test -f docs/runbooks/production-operations.md
          test -f apps/api/src/main/resources/application-production.yml
          test -f apps/ui/app/icon.svg
          test -d packages/config
          test -d packages/ui/tests
          test -f packages/api-clients/package.json
          test ! -f apps/ui/pnpm-workspace.yaml
          test ! -f apps/ui/pnpm-lock.yaml
          test ! -f apps/ui/packages
          test ! -f apps/api/pom.xml
          test ! -f docker-compose.prod.yml
          test ! -f .gitmodules
          if git ls-files -s | grep -q '^160000 '; then
            echo "Embedded Git repositories are not allowed."
            exit 1
          fi
      - name: "[SECURITY] Check high-confidence secrets in tracked files"
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E \
            -e '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}' \
            -- ':!pnpm-lock.yaml'; then
            echo "High-confidence secret pattern found in tracked files."
            exit 1
          fi
          if [ -n "$(git ls-files .env apps/ui/.env.local)" ]; then
            echo "Local environment files must not be tracked."
            exit 1
          fi
