name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and package API
        run: ./gradlew --no-daemon :api:test :api:bootJar

  web:
    name: Workspace checks, UI tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Check types, lint, and formatting
        run: pnpm check
      - name: Run UI unit tests
        run: pnpm test:unit
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run UI browser tests
        run: pnpm test:e2e
      - name: Build UI and shared packages
        run: pnpm exec turbo run build
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: complyz-playwright-artifacts
          path: |
            apps/ui/test-results
            apps/ui/playwright-report
          if-no-files-found: ignore

  api-contract:
    name: Spring OpenAPI and web contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: complyz_contract
          POSTGRES_USER: complyz_app
          POSTGRES_PASSWORD: complyz_contract_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complyz_app -d complyz_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Start Spring API with OpenAPI enabled
        env:
          SPRING_PROFILES_ACTIVE: contract
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: complyz_contract
          DB_USER: complyz_app
          DB_PASSWORD: complyz_contract_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          COMPLYZ_API_DOCS_ENABLED: "true"
        run: ./gradlew --no-daemon :api:bootRun > /tmp/complyz-api.log 2>&1 &
      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/complyz-api.log
          exit 1
      - name: Generate client types from Springdoc
        env:
          COMPLYZ_OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
        run: pnpm api:openapi
      - name: Verify the checked-in documentation contract
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/openapi.json)" ]; then
            echo "Regenerate and commit docs/openapi.json with pnpm api:openapi."
            git status --short -- docs/openapi.json
            exit 1
          fi
      - name: Type-check generated API client
        run: pnpm --filter @complyz/api-clients run typecheck
      - name: Run API/UI contract assertions
        env:
          COMPLYZ_OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
        run: pnpm test:contract

  configuration:
    name: Root configuration and repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Exercise Git hook behavior
        run: pnpm hooks:test
      - name: Test operational safety checks
        run: pnpm operations:test
      - name: Validate unified Compose profiles
        run: pnpm compose:config
      - name: Validate scripts and worktree topology
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done
          test ! -e scripts/backup-s3.sh
          test ! -e scripts/deploy-production.sh
          test -f .agents/skills/product-quality/SKILL.md
          for file in .githooks/*; do sh -n "$file"; test -x "$file"; done
          node -e "JSON.parse(require('node:fs').readFileSync('.zed/tasks.json', 'utf8'))"
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .github/copilot-instructions.md
          test -f .github/instructions/api.instructions.md
          test -f .github/instructions/ui.instructions.md
          test -f pnpm-workspace.yaml
          test -f turbo.json
          test -f gradlew
          test -f apps/ui/.env.example
          test -f docs/standards/product-language.md
          test -f docs/runbooks/production-operations.md
          test -f apps/api/src/main/resources/application-production.yml
          test -f apps/ui/app/icon.svg
          test -d packages/config
          test -d packages/ui/tests
          test -f packages/api-clients/package.json
          test ! -f apps/ui/pnpm-workspace.yaml
          test ! -f apps/ui/pnpm-lock.yaml
          test ! -f apps/ui/packages
          test ! -f apps/api/pom.xml
          test ! -f docker-compose.prod.yml
          test ! -f .gitmodules
          if git ls-files -s | grep -q '^160000 '; then
            echo "Embedded Git repositories are not allowed."
            exit 1
          fi
      - name: Check high-confidence secrets in tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E \
            -e '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}' \
            -- ':!pnpm-lock.yaml'; then
            echo "High-confidence secret pattern found in tracked files."
            exit 1
          fi
          if [ -n "$(git ls-files .env apps/ui/.env.local)" ]; then
            echo "Local environment files must not be tracked."
            exit 1
          fi
