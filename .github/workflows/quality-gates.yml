name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Compliance engine tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize submodules over HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B -f package/compliance-engine/pom.xml test

      - name: Build backend package
        run: mvn -B -f package/compliance-engine/pom.xml package -DskipTests

  frontend:
    name: Application typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/application
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize submodules over HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/application/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Run application lint
        run: pnpm lint

      - name: Build application
        run: pnpm build

  configuration:
    name: Configuration and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize submodules over HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run product-language check
        run: ./scripts/check-product-language.sh

      - name: Validate development Compose
        run: docker compose config --quiet

      - name: Validate production Compose when present
        run: |
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.prod.yml config --quiet
          fi

      - name: Validate shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Check tracked files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E \
            -e '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}' \
            -- ':!*.md' ':!*.example' ':!pnpm-lock.yaml'; then
            echo "High-confidence secret pattern found in tracked files."
            exit 1
          fi

      - name: Check ignored environment files are not tracked
        run: |
          if [ -n "$(git ls-files .env app/application/.env.local)" ]; then
            echo "Local environment files must not be tracked."
            exit 1
          fi

      - name: Check workspace manifest
        run: |
          test -f fincomphub-workspace.yaml
          grep -q 'package/compliance-engine' fincomphub-workspace.yaml
          grep -q 'app/application' fincomphub-workspace.yaml
