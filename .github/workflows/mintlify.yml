name: "[CI:DOCS] Mintlify Documentation Lint & Validation"

on:
  pull_request:
    paths:
      - "docs/**"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/mintlify.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/mintlify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mintlify-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "[TEST:DOCS] Format, Links, and Build Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "[SETUP] Setup pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.8.1
      - name: "[SETUP] Setup Node.js (workspace)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: "[SETUP] Install workspace formatting tools"
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: "[CHECK] Check documentation formatting"
        working-directory: .
        run: pnpm exec prettier --check docs
      - name: "[SETUP] Setup Node.js 24 (Mintlify runtime)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: "[SETUP] Install Mintlify CLI"
        run: npm install --global mint@4.2.991
      - name: "[TEST] Check internal links and anchors"
        run: mint broken-links --check-anchors
      - name: "[BUILD] Validate Mintlify build and API reference"
        run: mint validate
