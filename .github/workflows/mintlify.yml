name: Mintlify docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/mintlify.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/mintlify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mintlify-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, links, and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Install workspace formatting tools
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Check documentation formatting
        working-directory: .
        run: pnpm exec prettier --check docs
      # Mint supports Node 24 LTS; the workspace runtime is Node 26.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install Mintlify CLI
        run: npm install --global mint@4.2.991
      - name: Check internal links and anchors
        run: mint broken-links --check-anchors
      - name: Validate the Mintlify build and API reference
        run: mint validate
