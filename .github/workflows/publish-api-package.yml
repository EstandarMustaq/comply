name: Publish API Package with Gradle

on:
  workflow_dispatch:
  push:
    tags:
      - "api-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Complyz API to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish API package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew --no-daemon :api:test :api:publishApiPublicationToGitHubPackagesRepository
