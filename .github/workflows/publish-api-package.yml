name: "[CI:PUBLISH] Comply API Package"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-api-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "[BUILD:API] Verify and Publish Package"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "[SETUP] Java 21 Toolchain"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: "[SETUP] Gradle Cache"
        uses: gradle/actions/setup-gradle@v6

      - name: "[VERSION] Compute next vX.X.X-complyapi version"
        id: versioning
        run: |
          set -euo pipefail
          git fetch --tags --force
          EXISTING_TAGS=$(git tag -l "v*-complyapi" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-complyapi$' || true)
          if [ -z "$EXISTING_TAGS" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            LATEST_TAG=$(echo "$EXISTING_TAGS" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-complyapi$/\1/' | sort -V | tail -n1)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            case "${{ github.event.inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch|*) PATCH=$((PATCH + 1)) ;;
            esac
          fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}-complyapi"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: "[TEST] Run API verification"
        run: ./gradlew --no-daemon :api:test

      - name: "[PUBLISH] Publish package to GitHub Packages"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew --no-daemon :api:publishApiPublicationToGitHubPackagesRepository -Pversion="${{ steps.versioning.outputs.version }}"

      - name: "[RELEASE] Tag and create GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.tag }}
          VERSION_NAME: ${{ steps.versioning.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release Comply API ${VERSION_NAME}"
          git push origin "${TAG_NAME}"
          gh release create "${TAG_NAME}" --title "Comply API ${TAG_NAME}" --notes "Comply API package version ${VERSION_NAME}"
