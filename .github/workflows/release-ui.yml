name: Release Complyz UI Container

on:
  workflow_dispatch:
  push:
    tags:
      - "ui-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Complyz UI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Prepare image tags
        id: image-tags
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/complyz-ui"
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source revision must be a full commit SHA." >&2
            exit 1
          fi
          tags="${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^ui-v[A-Za-z0-9_.-]+$ || ${#GITHUB_REF_NAME} -gt 128 ]]; then
              echo "UI release tags must start with ui-v, contain Docker tag characters, and be at most 128 characters." >&2
              exit 1
            fi
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install root workspace
        run: pnpm install --frozen-lockfile
      - name: Validate UI and shared packages
        run: pnpm check && pnpm test:unit
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser interface
        run: pnpm test:e2e
      - name: Build UI
        run: pnpm --filter @complyz/web build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish Complyz UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
