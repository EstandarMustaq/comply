name: "[CI:RELEASE] Comply UI Container"

on:
  workflow_dispatch:
  push:
    tags:
      - "ui-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "[RELEASE:UI] Publish Comply UI Image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "[SETUP] Checkout repository"
        uses: actions/checkout@v7

      - name: "[SETUP] Prepare image tags"
        id: image-tags
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/comply-ui"
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source revision must be a full commit SHA." >&2
            exit 1
          fi
          tags="${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^ui-v[A-Za-z0-9_.-]+$ || ${#GITHUB_REF_NAME} -gt 128 ]]; then
              echo "UI release tags must start with ui-v, contain Docker tag characters, and be at most 128 characters." >&2
              exit 1
            fi
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: "[SETUP] Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: "[SETUP] Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: "[SETUP] Install workspace dependencies"
        run: pnpm install --frozen-lockfile

      - name: "[TEST] Validate UI and shared packages"
        run: pnpm check && pnpm test:unit

      - name: "[TEST] Verify Storybook component library"
        run: pnpm storybook:build

      - name: "[BUILD] Build Next.js application"
        run: pnpm --filter @comply/web build

      - name: "[AUTH] Log in to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[SETUP] Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "[BUILD] Publish Comply UI image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
