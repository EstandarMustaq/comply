name: Deploy to Amazon ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that contains the AWS deployment controls
        required: true
        default: production
        type: environment
      image-tag:
        description: Immutable GHCR image tag to deploy
        required: true
        type: string
      task-definition:
        description: Repository path to the ECS task definition JSON
        required: true
        type: string
      cluster:
        description: ECS cluster name
        required: true
        type: string
      service:
        description: ECS service name
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: deploy-ecs-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved revision to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize submodules over HTTPS
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          test -n "$SUBMODULES_TOKEN" || { echo "::error::Configure the SUBMODULES_TOKEN repository secret with read access to both private submodules."; exit 1; }
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Normalize image namespace
        id: image-names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ inputs.task-definition }}
          container-name: grc-engine
          image: ghcr.io/${{ steps.image-names.outputs.owner }}/grc-engine:${{ inputs.image-tag }}

      - name: Render design system image
        id: design-system-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          container-name: design-system
          image: ghcr.io/${{ steps.image-names.outputs.owner }}/design-system:${{ inputs.image-tag }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.design-system-task-definition.outputs.task-definition }}
          service: ${{ inputs.service }}
          cluster: ${{ inputs.cluster }}
          wait-for-service-stability: true
