name: "[CI:PUBLISH] Container Images"

on:
  workflow_run:
    workflows: ["[CI:GATE] Quality Assurance"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "[BUILD:CONTAINERS] Build and Publish API & UI Images"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "[SETUP] Check out validated revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "[SETUP] Normalize image namespace"
        id: image-names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: "[AUTH] Log in to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[SETUP] Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: "[BUILD:API] Build and publish API image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ steps.image-names.outputs.owner }}/comply-api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=comply-api
          cache-to: type=gha,mode=max,scope=comply-api

      - name: "[BUILD:UI] Build and publish UI image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: ghcr.io/${{ steps.image-names.outputs.owner }}/comply-ui:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=comply-ui
          cache-to: type=gha,mode=max,scope=comply-ui
