name: Publish Docker Containers

on:
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish engine and application images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: false

      - name: Initialize submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/compliance-engine
            ghcr.io/${{ github.repository_owner }}/application
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish compliance engine
        uses: docker/build-push-action@v6
        with:
          context: package/compliance-engine
          file: package/compliance-engine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/compliance-engine:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=compliance-engine
          cache-to: type=gha,mode=max,scope=compliance-engine

      - name: Build and publish application
        uses: docker/build-push-action@v6
        with:
          context: app/application
          file: app/application/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/application:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
