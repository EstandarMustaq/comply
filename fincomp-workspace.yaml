version: 1
name: fincomp-platform
product: Financial Compliance Intelligent

components:
  grc-engine:
    path: package/grc-engine
    repository: git@github.com:tryfincomp/grc-engine.git
    technology: spring-boot
    build: mvn -q -f package/grc-engine/pom.xml package -DskipTests
    test: mvn -q -f package/grc-engine/pom.xml test
  design-system:
    path: app/design-system
    repository: git@github.com:tryfincomp/design-system.git
    technology: nextjs
    install: pnpm --dir app/design-system install --frozen-lockfile
    build: pnpm --dir app/design-system build
    test: pnpm --dir app/design-system run test:unit
    contract-test: pnpm --dir app/design-system run test:contract
    typecheck: pnpm --dir app/design-system run typecheck
    lint: pnpm --dir app/design-system run lint

workspace:
  install: ./scripts/workspace.sh install
  dev: ./scripts/workspace.sh dev
  build: ./scripts/workspace.sh build
  test: ./scripts/workspace.sh test
  quality: ./scripts/workspace.sh quality
  compose-config: ./scripts/workspace.sh compose-config
  migrate: ./scripts/workspace.sh migrate
  deploy: ./scripts/workspace.sh deploy
  backup: ./scripts/workspace.sh backup
  keys: ./scripts/workspace.sh keys

infrastructure:
  compose:
    development: docker-compose.yml
    production: docker-compose.prod.yml
  edge: Caddyfile

policies:
  tenant-scope: authenticated-user-organization
  product-language: docs/product-language.md
  internal-traceability: docs/traceability.md
  submodules: recursive
