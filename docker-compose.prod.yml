services:
  caddy:
    image: caddy:2-alpine
    container_name: fincomp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      compliance-engine:
        condition: service_healthy
      application:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: "${CADDY_CPU_LIMIT:-0.25}"
    mem_limit: "${CADDY_MEMORY_LIMIT:-128m}"
    labels:
      com.fincomp.environment: production
      com.fincomp.service: edge
      com.fincomp.cost-center: platform
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  application:
    build:
      context: ./app/application
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-FinComp}
    container_name: fincomp-application
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      compliance-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: "${FRONTEND_CPU_LIMIT:-0.50}"
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-512m}"
    labels:
      com.fincomp.environment: production
      com.fincomp.service: application
      com.fincomp.cost-center: product
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  compliance-engine:
    build:
      context: ./package/compliance-engine
      dockerfile: Dockerfile
    container_name: fincomp-compliance-engine
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fincomp_db}
      - POSTGRES_USER=${POSTGRES_USER:-fincomp_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-${MFA_AES_KEY}}
      - MFA_AES_KEY=${MFA_AES_KEY:-${MFA_ENCRYPTION_KEY}}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      - FINCOMP_BOOTSTRAP_ENABLED=${FINCOMP_BOOTSTRAP_ENABLED:-false}
      - FINCOMP_BOOTSTRAP_ADMIN_FULL_NAME=${FINCOMP_BOOTSTRAP_ADMIN_FULL_NAME:-}
      - FINCOMP_BOOTSTRAP_ADMIN_EMAIL=${FINCOMP_BOOTSTRAP_ADMIN_EMAIL:-}
      - FINCOMP_BOOTSTRAP_ADMIN_PASSWORD=${FINCOMP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - FINCOMP_BOOTSTRAP_OCOS_FULL_NAME=${FINCOMP_BOOTSTRAP_OCOS_FULL_NAME:-}
      - FINCOMP_BOOTSTRAP_OCOS_EMAIL=${FINCOMP_BOOTSTRAP_OCOS_EMAIL:-}
      - FINCOMP_BOOTSTRAP_OCOS_PASSWORD=${FINCOMP_BOOTSTRAP_OCOS_PASSWORD:-}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
      - FINCOMP_IMPORT_STORAGE_PATH=${FINCOMP_IMPORT_STORAGE_PATH:-/var/lib/fincomp/imports}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    cpus: "${BACKEND_CPU_LIMIT:-1.00}"
    mem_limit: "${BACKEND_MEMORY_LIMIT:-1024m}"
    labels:
      com.fincomp.environment: production
      com.fincomp.service: compliance-engine
      com.fincomp.cost-center: product
    volumes:
      - fincomp_imports:/var/lib/fincomp/imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: fincomp-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincomp_db}
      POSTGRES_USER: ${POSTGRES_USER:-fincomp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincomp_app} -d ${POSTGRES_DB:-fincomp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "${POSTGRES_CPU_LIMIT:-1.00}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1024m}"
    labels:
      com.fincomp.environment: production
      com.fincomp.service: postgres
      com.fincomp.cost-center: data
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fincomp-prod-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "${REDIS_CPU_LIMIT:-0.50}"
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    labels:
      com.fincomp.environment: production
      com.fincomp.service: redis
      com.fincomp.cost-center: data
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  fincomp_imports:

networks:
  fincomp-net:
    driver: bridge
