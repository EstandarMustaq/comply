name: comply

services:
  postgres:
    image: postgres:16-alpine
    container_name: comply-postgres-dev
    profiles: [app]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comply_db}
      POSTGRES_USER: ${POSTGRES_USER:-comply_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comply_dev_password}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: comply-redis-dev
    profiles: [app]
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_dev_password}",
      ]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  production-preflight:
    image: node:26-alpine
    profiles: [production]
    entrypoint: ["node", "/production-compose-preflight.mjs"]
    volumes:
      - ./scripts/production-compose-preflight.mjs:/production-compose-preflight.mjs:ro
      - ./scripts/deploy-production.mjs:/deploy-production.mjs:ro
    environment:
      COMPLY_ENVIRONMENT: ${COMPLY_ENVIRONMENT:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DOMAIN: ${DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      COMPLY_BOOTSTRAP_ENABLED: ${COMPLY_BOOTSTRAP_ENABLED:-}
      POSTGRES_VOLUME_NAME: ${POSTGRES_VOLUME_NAME:-}
      REDIS_VOLUME_NAME: ${REDIS_VOLUME_NAME:-}

  postgres-production:
    image: postgres:16-alpine
    container_name: comply-postgres
    profiles: [production]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comply_db}
      POSTGRES_USER: ${POSTGRES_USER:-comply_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comply_dev_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    depends_on:
      production-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis-production:
    image: redis:7-alpine
    container_name: comply-redis
    profiles: [production]
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_dev_password}",
      ]
    volumes:
      - redis_prod_data:/data
    depends_on:
      production-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    container_name: comply-api-dev
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ghcr.io/estandarmustaq/comply-api:${COMPLY_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-comply_db}
      DB_USER: ${POSTGRES_USER:-comply_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-comply_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      MFA_AES_KEY: ${MFA_AES_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COMPLY_BOOTSTRAP_ENABLED: ${COMPLY_BOOTSTRAP_ENABLED:-false}
      COMPLY_BOOTSTRAP_ADMIN_FULL_NAME: ${COMPLY_BOOTSTRAP_ADMIN_FULL_NAME:-}
      COMPLY_BOOTSTRAP_ADMIN_EMAIL: ${COMPLY_BOOTSTRAP_ADMIN_EMAIL:-}
      COMPLY_BOOTSTRAP_ADMIN_PASSWORD: ${COMPLY_BOOTSTRAP_ADMIN_PASSWORD:-}
      COMPLY_BOOTSTRAP_OCOS_FULL_NAME: ${COMPLY_BOOTSTRAP_OCOS_FULL_NAME:-}
      COMPLY_BOOTSTRAP_OCOS_EMAIL: ${COMPLY_BOOTSTRAP_OCOS_EMAIL:-}
      COMPLY_BOOTSTRAP_OCOS_PASSWORD: ${COMPLY_BOOTSTRAP_OCOS_PASSWORD:-}
      COMPLY_IMPORT_STORAGE_PATH: /var/lib/comply/imports
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
    volumes:
      - imports:/var/lib/comply/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    cpus: ${API_CPU_LIMIT:-1.00}
    mem_limit: ${API_MEMORY_LIMIT:-1024m}
    labels:
      com.comply.environment: ${COMPLY_ENVIRONMENT:-development}
      com.comply.service: api
      com.comply.cost-center: product
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api-production:
    container_name: comply-api
    profiles: [production]
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ghcr.io/estandarmustaq/comply-api:${COMPLY_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres-production
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-comply_db}
      DB_USER: ${POSTGRES_USER:-comply_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-comply_dev_password}
      REDIS_HOST: redis-production
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      MFA_AES_KEY: ${MFA_AES_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      COMPLY_BOOTSTRAP_ENABLED: ${COMPLY_BOOTSTRAP_ENABLED:-}
      COMPLY_BOOTSTRAP_ADMIN_FULL_NAME: ${COMPLY_BOOTSTRAP_ADMIN_FULL_NAME:-}
      COMPLY_BOOTSTRAP_ADMIN_EMAIL: ${COMPLY_BOOTSTRAP_ADMIN_EMAIL:-}
      COMPLY_BOOTSTRAP_ADMIN_PASSWORD: ${COMPLY_BOOTSTRAP_ADMIN_PASSWORD:-}
      COMPLY_BOOTSTRAP_OCOS_FULL_NAME: ${COMPLY_BOOTSTRAP_OCOS_FULL_NAME:-}
      COMPLY_BOOTSTRAP_OCOS_EMAIL: ${COMPLY_BOOTSTRAP_OCOS_EMAIL:-}
      COMPLY_BOOTSTRAP_OCOS_PASSWORD: ${COMPLY_BOOTSTRAP_OCOS_PASSWORD:-}
      COMPLY_IMPORT_STORAGE_PATH: /var/lib/comply/imports
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
    volumes:
      - imports:/var/lib/comply/imports
    depends_on:
      production-preflight:
        condition: service_completed_successfully
      postgres-production:
        condition: service_healthy
      redis-production:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    cpus: ${API_CPU_LIMIT:-1.00}
    mem_limit: ${API_MEMORY_LIMIT:-1024m}
    labels:
      com.comply.environment: production
      com.comply.service: api
      com.comply.cost-center: product
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ui:
    container_name: comply-ui-dev
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Comply}
    image: ghcr.io/estandarmustaq/comply-ui:${COMPLY_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: ${UI_CPU_LIMIT:-0.50}
    mem_limit: ${UI_MEMORY_LIMIT:-512m}
    labels:
      com.comply.environment: ${COMPLY_ENVIRONMENT:-development}
      com.comply.service: ui
      com.comply.cost-center: product
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ui-production:
    container_name: comply-ui
    profiles: [production]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Comply}
    image: ghcr.io/estandarmustaq/comply-ui:${COMPLY_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api-production:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: ${UI_CPU_LIMIT:-0.50}
    mem_limit: ${UI_MEMORY_LIMIT:-512m}
    labels:
      com.comply.environment: production
      com.comply.service: ui
      com.comply.cost-center: product
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    container_name: comply-caddy
    profiles: [production]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.trycomply.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-production:
        condition: service_healthy
      ui-production:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: ${CADDY_CPU_LIMIT:-0.25}
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    labels:
      com.comply.environment: production
      com.comply.service: edge
      com.comply.cost-center: platform
    networks: [comply]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_dev_data:
    name: comply_postgres_data
  redis_dev_data:
    name: comply_redis_data
  postgres_prod_data:
    name: ${POSTGRES_VOLUME_NAME:-comply_postgres_prod_data}
  redis_prod_data:
    name: ${REDIS_VOLUME_NAME:-comply_redis_prod_data}
  imports:
    name: ${COMPLY_IMPORT_VOLUME_NAME:-comply_imports}
  caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-comply_caddy_data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-comply_caddy_config}

networks:
  comply:
    name: comply-net
    driver: bridge
