services:
  postgres:
    image: postgres:16-alpine
    container_name: fincomp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincomp_db}
      POSTGRES_USER: ${POSTGRES_USER:-fincomp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincomp_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincomp_app} -d ${POSTGRES_DB:-fincomp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fincomp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  compliance-engine:
    build:
      context: ./package/compliance-engine
      dockerfile: Dockerfile
    container_name: fincomp-compliance-engine
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fincomp_db}
      DB_USER: ${POSTGRES_USER:-fincomp_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fincomp_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      MFA_AES_KEY: ${MFA_AES_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FINCOMP_BOOTSTRAP_ENABLED: ${FINCOMP_BOOTSTRAP_ENABLED:-false}
      FINCOMP_BOOTSTRAP_ADMIN_FULL_NAME: ${FINCOMP_BOOTSTRAP_ADMIN_FULL_NAME:-}
      FINCOMP_BOOTSTRAP_ADMIN_EMAIL: ${FINCOMP_BOOTSTRAP_ADMIN_EMAIL:-}
      FINCOMP_BOOTSTRAP_ADMIN_PASSWORD: ${FINCOMP_BOOTSTRAP_ADMIN_PASSWORD:-}
      FINCOMP_BOOTSTRAP_OCOS_FULL_NAME: ${FINCOMP_BOOTSTRAP_OCOS_FULL_NAME:-}
      FINCOMP_BOOTSTRAP_OCOS_EMAIL: ${FINCOMP_BOOTSTRAP_OCOS_EMAIL:-}
      FINCOMP_BOOTSTRAP_OCOS_PASSWORD: ${FINCOMP_BOOTSTRAP_OCOS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["app", "full"]

  application:
    build:
      context: ./app/application
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-FinComp}
    container_name: fincomp-application
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - compliance-engine
    networks:
      - fincomp-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["app", "full"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fincomp-net:
    driver: bridge
