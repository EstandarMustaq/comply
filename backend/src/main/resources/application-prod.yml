# FinComp Production Profile (Strict Mode)
# All sensitive secrets MUST be provided via environment variables.

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:fincomp_db}
    username: ${POSTGRES_USER:fincomp_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

fincomp:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      refresh-expiration-days: 7
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY:${MFA_AES_KEY}}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://${DOMAIN:-localhost}}

logging:
  level:
    root: WARN
    com.fincomp: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
